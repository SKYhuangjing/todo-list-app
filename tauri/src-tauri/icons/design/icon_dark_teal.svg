<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 深色圆角背景 -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#darkGradient)"/>
  <!-- 边框装饰 -->
  <rect x="84" y="84" width="856" height="856" rx="160" ry="160" fill="none" stroke="#14B8A6" stroke-width="4" opacity="0.3"/>
  <!-- 发光勾选符号 -->
  <path d="M280 520 L440 680 L744 376" 
        fill="none" 
        stroke="#14B8A6" 
        stroke-width="80" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
